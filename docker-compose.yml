services:
  redpanda:
    image: redpandadata/redpanda:latest
    container_name: redpanda
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=512M
      - --reserve-memory=0M
      - --overprovisioned
      - --node-id=0
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://redpanda:9092
      - --mode=dev-container
    ports:
      - "9092:9092"
      - "9644:9644"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  redpanda-console:
    image: redpandadata/console:latest
    container_name: redpanda-console
    environment:
      - KAFKA_BROKERS=redpanda:9092
    ports:
      - "8090:8080"
    depends_on:
      redpanda:
        condition: service_healthy

  redis-shortener:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  redis-redirect:
    image: redis:7-alpine
    ports:
      - "6380:6379"

  db-shortener:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_shortener_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  db-redirect:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - postgres_redirect_data:/var/lib/postgresql/data
      - ./LinkForge.Redirect/internal/repository/postgres/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./LinkForge.Shortener
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
      - "5001:5001"
    environment:
      - ConnectionStrings__DefaultConnection=Host=db-shortener;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT}
      - Cors__AllowedOrigins__0=${Cors__AllowedOrigins__0}
      - RateLimiting__PermitLimit=${RateLimiting__PermitLimit}
      - RateLimiting__WindowSeconds=${RateLimiting__WindowSeconds}
      - API_KEY=${API_KEY}
      - ConnectionStrings__Redis=redis-shortener:6379
      - Kafka__BootstrapServers=redpanda:9092
      - Kafka__LinksCreatedTopic=linkforge.links.created
    depends_on:
      db-shortener:
        condition: service_healthy
      redis-shortener:
        condition: service_started
      redpanda:
        condition: service_healthy

  redirect:
    build:
      context: ./LinkForge.Redirect
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db-redirect:5432/${POSTGRES_DB}?sslmode=disable
      - REDIS_URL=redis-redirect:6379
      - PORT=8081
      - LOG_LEVEL=info
      - CORS_ALLOWED_ORIGINS=${Cors__AllowedOrigins__0}
      - RATE_LIMIT_RPS=100
      - RATE_LIMIT_BURST=200
      - KAFKA_BROKERS=redpanda:9092
      - KAFKA_TOPIC=linkforge.links.created
      - KAFKA_GROUP_ID=redirect-service
      - SHORTENER_GRPC_ADDR=api:5001
      - API_KEY=${API_KEY}
      - ORIGIN_TIMEOUT_SECONDS=2
    depends_on:
      db-redirect:
        condition: service_healthy
      redis-redirect:
        condition: service_started
      redpanda:
        condition: service_healthy

  frontend:
    build:
      context: ./LinkForge.FrontEnd
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    environment:
      - PORT=${PORT}
      - API_KEY=${API_KEY}
      - REDIRECT_BACKEND_HOST=${REDIRECT_BACKEND_HOST}
      - SHORTENER_BACKEND_HOST=${SHORTENER_BACKEND_HOST}
    depends_on:
      - api
      - redirect

volumes:
  postgres_shortener_data:
  postgres_redirect_data:
