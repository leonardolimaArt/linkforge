name: CI/CD

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, develop]

jobs:
  tests:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore LinkForge.Shortener/LinkForge.Shortener.slnx

      - name: Build
        run: dotnet build LinkForge.Shortener/LinkForge.Shortener.slnx --no-restore --configuration Release

      - name: Run unit tests
        run: |
          dotnet test LinkForge.Shortener/tests/Domain.Tests --no-build --configuration Release
          dotnet test LinkForge.Shortener/tests/Application.Tests --no-build --configuration Release

      - name: Run integration and functional tests
        run: |
          dotnet test LinkForge.Shortener/tests/Infrastructure.Tests --configuration Release
          dotnet test LinkForge.Shortener/tests/Api.Tests --configuration Release

  deploy-qas:
    name: Deploy to QAS
    runs-on: ubuntu-latest
    needs: tests
    environment: LINKFORGE/development
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy
        run: railway up --service ${{secrets.RAILWAY_SERVICE_ID}} --environment development --detach
        env:
          RAILWAY_TOKEN: ${{secrets.RAILWAY_TOKEN_QAS_DEV}}

  deploy-prd:
    name: Deploy to PRD
    runs-on: ubuntu-latest
    needs: tests
    environment: LINKFORGE/production
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy
        run: railway up --service ${{secrets.RAILWAY_SERVICE_ID}} --environment production --detach
        env:
          RAILWAY_TOKEN: ${{secrets.RAILWAY_TOKEN_PRD}}