name: Shortener

on:
  push:
    branches: [main]
    paths:
      - 'LinkForge.Shortener/**'
      - 'proto/**'
      - '.github/workflows/shortener.yml'
  pull_request:
    branches: [main]
    paths:
      - 'LinkForge.Shortener/**'
      - 'proto/**'
  workflow_dispatch:

concurrency:
  group: shortener-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('LinkForge.Shortener/**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      - run: dotnet restore LinkForge.Shortener/LinkForge.Shortener.slnx

      - run: dotnet build LinkForge.Shortener/LinkForge.Shortener.slnx --no-restore --configuration Release

      - name: Unit tests
        run: |
          dotnet test LinkForge.Shortener/tests/Domain.Tests --no-build --configuration Release
          dotnet test LinkForge.Shortener/tests/Application.Tests --no-build --configuration Release

      - name: Integration tests
        run: |
          dotnet test LinkForge.Shortener/tests/Infrastructure.Tests --configuration Release
          dotnet test LinkForge.Shortener/tests/Api.Tests --configuration Release

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: LINKFORGE / production
    steps:
      - uses: actions/checkout@v4
      - run: npm install -g @railway/cli
      - run: railway up --service ${{ vars.RAILWAY_SHORTENER_SERVICE_ID }} --environment production --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_PRD }}
