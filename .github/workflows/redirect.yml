name: Redirect

on:
  push:
    branches: [main]
    paths:
      - 'LinkForge.Redirect/**'
      - 'proto/**'
      - '.github/workflows/redirect.yml'
  pull_request:
    branches: [main]
    paths:
      - 'LinkForge.Redirect/**'
      - 'proto/**'
  workflow_dispatch:

concurrency:
  group: redirect-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: LinkForge.Redirect
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
          cache-dependency-path: LinkForge.Redirect/go.sum

      - run: go vet ./...

      - run: go test ./internal/... -race -timeout 2m

      - name: Integration tests
        run: go test ./test/integration/... -timeout 5m

      - run: go build -o /tmp/redirect ./cmd/redirect

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: test
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    environment: LINKFORGE / production
    steps:
      - uses: actions/checkout@v4
      - run: npm install -g @railway/cli
      - run: railway up --service ${{ secrets.RAILWAY_REDIRECT_SERVICE_ID }} --environment production --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_PRD }}
