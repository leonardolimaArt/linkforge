syntax = "proto3";
package linkforge.v1;
import "google/protobuf/timestamp.proto";

option csharp_namespace = "LinkForge.Grpc.V1";
option go_package = "github.com/leonardolimaArt/linkforge/LinkForge.Redirect/gen/linkforge/v1;linkforgev1";

service LinkService{
    rpc Resolve(ResolveRequest) returns (ResolveResponse);
}

message ResolveRequest {
    string short_code = 1;
}

message ResolveResponse {
    string id = 1;
    string short_code = 2;
    string original_url = 3;
    google.protobuf.Timestamp created_at = 4;
}
