version: "2"
sql:
  - engine: "postgresql"
    queries: "internal/repository/postgres/queries.sql"
    schema: "internal/repository/postgres/schema.sql"
    gen:
      go:
        package: "postgres"
        out: "internal/repository/postgres"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_pointers_for_null_types: true